<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>alifbo — Oʻzbek lotin alifbosi konvertori</title>
    <meta
      name="description"
      content="Convert Uzbek text and Word documents between Cyrillic, the current Latin alphabet, and the new 2026 Latin alphabet. Runs entirely in your browser."
    />
    <meta property="og:title" content="alifbo — Uzbek alphabet converter" />
    <meta
      property="og:description"
      content="oʻ → ö · gʻ → ğ · sh → ş · ch → ç. Convert Uzbek text and Word documents in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://azakapro.github.io/alifbo/" />
    <meta property="og:image" content="https://azakapro.github.io/alifbo/og.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://azakapro.github.io/alifbo/og.png" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Apply a saved theme before first paint so the page never flashes the wrong colors.
      try {
        var theme = localStorage.getItem('alifbo.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-swap" viewBox="0 0 24 24">
        <path d="M7 7h13m0 0-4-4m4 4-4 4M17 17H4m0 0 4 4m-4-4 4-4" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2.5" />
        <path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16V5m0 0L7.5 9.5M12 5l4.5 4.5M5 19.5h14" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11m0-11-11 11" /></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24">
        <path d="M14 3.5H7.5A2 2 0 0 0 5.5 5.5v13a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z" />
        <path d="M14 3.5V8h4.5M9 12.5h6M9 16h4" />
      </symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6.5h14M5 11h14M5 15.5h9" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"
        />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10.5" width="14" height="10" rx="2.5" />
        <path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" />
      </symbol>
      <symbol id="i-layout" viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="3" />
        <path d="M4 9.5h16M9.5 9.5V20" />
      </symbol>
      <symbol id="i-code" viewBox="0 0 24 24">
        <path d="m8.5 7.5-5 4.5 5 4.5m7-9 5 4.5-5 4.5" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 11v5.5M12 7.8v.2" />
      </symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path
          d="M12 8.5v4.5m0 3.2v.3M10.3 4.3 3 17a2 2 0 0 0 1.7 3h14.6A2 2 0 0 0 21 17L13.7 4.3a2 2 0 0 0-3.4 0z"
        />
      </symbol>
    </svg>

    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./" aria-label="alifbo"><b>alif</b>bo</a>
        <div class="topbar-actions">
          <button type="button" class="topbar-button" data-dialog="aboutDialog">
            <svg class="icon"><use href="#i-info" /></svg><span data-i18n="about"></span>
          </button>
          <button
            type="button"
            class="icon-button"
            data-dialog="devDialog"
            data-i18n-title="devTitle"
          >
            <svg class="icon"><use href="#i-code" /></svg>
          </button>
          <nav class="segmented lang" aria-label="Language">
            <button type="button" data-lang="uz">
              <span class="long">Oʻzbekcha</span><span class="short">UZ</span>
            </button>
            <button type="button" data-lang="ru">
              <span class="long">Русский</span><span class="short">RU</span>
            </button>
            <button type="button" data-lang="en">
              <span class="long">English</span><span class="short">EN</span>
            </button>
          </nav>
          <button id="theme" class="icon-button" type="button">
            <svg class="icon icon-moon"><use href="#i-moon" /></svg>
            <svg class="icon icon-sun"><use href="#i-sun" /></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <h1 data-i18n="title"></h1>
        <p class="sub" data-i18n="subtitle"></p>
        <ol class="letters" aria-label="oʻ → ö, gʻ → ğ, sh → ş, ch → ç">
          <li style="--i: 0">
            <span class="old">oʻ</span><span class="arrow">→</span><span class="new">ö</span>
          </li>
          <li style="--i: 1">
            <span class="old">gʻ</span><span class="arrow">→</span><span class="new">ğ</span>
          </li>
          <li style="--i: 2">
            <span class="old">sh</span><span class="arrow">→</span><span class="new">ş</span>
          </li>
          <li style="--i: 3">
            <span class="old">ch</span><span class="arrow">→</span><span class="new">ç</span>
          </li>
        </ol>
      </section>

      <section class="converter" id="converter" aria-label="Converter">
        <div class="converter-top">
          <div class="segmented mode" role="tablist">
            <button id="modeText" type="button" role="tab" data-mode="text">
              <svg class="icon"><use href="#i-text" /></svg><span data-i18n="tabText"></span>
            </button>
            <button id="modeDoc" type="button" role="tab" data-mode="doc">
              <svg class="icon"><use href="#i-doc" /></svg><span data-i18n="tabDoc"></span>
            </button>
          </div>
          <span id="status" class="status" role="status"></span>
        </div>

        <div class="direction">
          <label class="picker">
            <span class="picker-label"
              ><span data-i18n="from"></span>
              <span id="detected" class="detected" aria-live="polite"></span
            ></span>
            <select id="from">
              <option value="auto" data-i18n="auto"></option>
              <option value="cyrillic" data-i18n="cyrillic"></option>
              <option value="old-latin" data-i18n="oldLatin"></option>
              <option value="new-latin" data-i18n="newLatin"></option>
            </select>
          </label>
          <button id="swap" class="swap" type="button" data-i18n-title="swap">
            <svg class="icon"><use href="#i-swap" /></svg>
          </button>
          <label class="picker">
            <span class="picker-label" data-i18n="to"></span>
            <select id="to">
              <option value="new-latin" data-i18n="newLatin"></option>
              <option value="old-latin" data-i18n="oldLatin"></option>
              <option value="cyrillic" data-i18n="cyrillic"></option>
            </select>
          </label>
        </div>

        <p id="notice" class="notice" role="alert" hidden></p>

        <div id="dropzone" class="dropzone" hidden>
          <div class="dropzone-icon">
            <svg class="icon"><use href="#i-upload" /></svg>
          </div>
          <p class="dropzone-title" data-i18n="dropTitle"></p>
          <label class="button primary">
            <input
              class="file-input"
              type="file"
              accept=".docx,.txt,.md,.csv,.srt,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
              hidden
            />
            <span data-i18n="chooseFile"></span>
          </label>
          <p class="dropzone-formats" data-i18n="formats"></p>
        </div>

        <div id="fileBanner" class="file-banner" hidden>
          <svg class="icon"><use href="#i-doc" /></svg>
          <div class="file-banner-text">
            <strong id="fileName"></strong>
            <span data-i18n="fileNote"></span>
          </div>
          <button
            id="closeFile"
            class="icon-button subtle"
            type="button"
            data-i18n-title="closeFile"
          >
            <svg class="icon"><use href="#i-close" /></svg>
          </button>
        </div>

        <div id="panes" class="panes">
          <div class="pane" id="inputPane">
            <textarea id="input" spellcheck="false" autocomplete="off"></textarea>
            <div class="pane-bar">
              <div class="examples">
                <span class="examples-label" data-i18n="tryExample"></span>
                <button type="button" class="chip" data-example="old">Oʻzbekiston</button>
                <button type="button" class="chip" data-example="cyr">Ўзбекистон</button>
                <button type="button" class="chip" data-example="tutuq">Isʼhoq</button>
              </div>
              <div class="pane-tools">
                <span id="inCount" class="count"></span>
                <label class="icon-button subtle" data-i18n-title="openFile">
                  <input
                    class="file-input"
                    type="file"
                    accept=".docx,.txt,.md,.csv,.srt,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                    hidden
                  />
                  <svg class="icon"><use href="#i-upload" /></svg>
                </label>
                <button id="clear" class="icon-button subtle" type="button" data-i18n-title="clear">
                  <svg class="icon"><use href="#i-close" /></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="pane output" id="outputPane">
            <textarea id="output" readonly spellcheck="false"></textarea>
            <div class="pane-bar">
              <div class="pane-tools">
                <span id="outCount" class="count"></span>
                <button id="download" class="button" type="button">
                  <svg class="icon"><use href="#i-download" /></svg><span id="downloadLabel"></span>
                </button>
                <button id="copy" class="button primary" type="button">
                  <svg class="icon icon-copy"><use href="#i-copy" /></svg>
                  <svg class="icon icon-check"><use href="#i-check" /></svg>
                  <span id="copyLabel"></span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <details id="review" class="review-bar" hidden>
          <summary>
            <svg class="icon"><use href="#i-alert" /></svg>
            <span data-i18n="review"></span>
            <span id="reviewCount" class="pill warn"></span>
            <svg class="icon chevron"><use href="#i-chevron" /></svg>
          </summary>
          <div id="reviewList" class="review-list"></div>
        </details>

        <div class="converter-foot">
          <p class="privacy">
            <svg class="icon"><use href="#i-lock" /></svg><span data-i18n="privacy"></span>
          </p>
          <details class="options">
            <summary data-i18n="options"></summary>
            <div class="options-body">
              <label class="check">
                <input id="protectSpans" type="checkbox" checked />
                <span data-i18n="protectSpans"></span>
              </label>
              <label class="field">
                <span data-i18n="protectedTerms"></span>
                <input id="protectedTerms" type="text" placeholder="Chevrolet, Shakespeare" />
              </label>
            </div>
          </details>
        </div>
      </section>
    </main>

    <footer class="wrap footer">
      <p class="legal" data-i18n="legal"></p>
      <div class="footer-row">
        <p class="author"><span data-i18n="madeBy"></span> <strong>Azizullo Temirov</strong></p>
        <nav class="socials" aria-label="Social">
          <a href="https://t.me/azaka_notes" target="_blank" rel="noopener">Telegram</a>
          <a href="https://www.youtube.com/@azizullotm" target="_blank" rel="noopener">YouTube</a>
          <a href="https://www.instagram.com/azakapro/" target="_blank" rel="noopener">Instagram</a>
          <a href="https://www.linkedin.com/in/azizullo/" target="_blank" rel="noopener"
            >LinkedIn</a
          >
        </nav>
      </div>
      <p class="license">MIT · alifbo</p>
    </footer>

    <dialog id="aboutDialog" class="sheet" aria-labelledby="aboutTitle">
      <div class="sheet-head">
        <h2 id="aboutTitle" tabindex="-1" autofocus data-i18n="aboutTitle"></h2>
        <button type="button" class="icon-button subtle" data-close data-i18n-title="closeFile">
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <ul class="about-list">
        <li>
          <svg class="icon"><use href="#i-lock" /></svg>
          <div>
            <h3 data-i18n="featurePrivateTitle"></h3>
            <p data-i18n="featurePrivateText"></p>
          </div>
        </li>
        <li>
          <svg class="icon"><use href="#i-layout" /></svg>
          <div>
            <h3 data-i18n="featureDocTitle"></h3>
            <p data-i18n="featureDocText"></p>
          </div>
        </li>
        <li>
          <svg class="icon"><use href="#i-alert" /></svg>
          <div>
            <h3 data-i18n="featureReviewTitle"></h3>
            <p data-i18n="featureReviewText"></p>
          </div>
        </li>
      </ul>
    </dialog>

    <dialog id="devDialog" class="sheet" aria-labelledby="devTitle">
      <div class="sheet-head">
        <h2 id="devTitle" tabindex="-1" autofocus data-i18n="devTitle"></h2>
        <button type="button" class="icon-button subtle" data-close data-i18n-title="closeFile">
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <p class="sheet-text" data-i18n="devText"></p>
      <div class="commands">
        <button type="button" class="command" data-copy="npm install alifbo">
          <code>npm install alifbo</code><svg class="icon"><use href="#i-copy" /></svg>
        </button>
        <button type="button" class="command" data-copy="pip install alifbo">
          <code>pip install alifbo</code><svg class="icon"><use href="#i-copy" /></svg>
        </button>
      </div>
      <p class="sheet-links">
        <a href="https://github.com/azakapro/alifbo" target="_blank" rel="noopener">GitHub</a>
        <a href="https://www.npmjs.com/package/alifbo" target="_blank" rel="noopener">npm</a>
        <a href="https://pypi.org/project/alifbo/" target="_blank" rel="noopener">PyPI</a>
        <a
          href="https://github.com/azakapro/alifbo/issues/new/choose"
          target="_blank"
          rel="noopener"
          data-i18n="report"
        ></a>
      </p>
    </dialog>

    <div id="dropOverlay" class="drop-overlay" hidden>
      <div class="drop-overlay-card">
        <svg class="icon"><use href="#i-upload" /></svg>
        <p data-i18n="dropTitle"></p>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
